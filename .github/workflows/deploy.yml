name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Public half of the VAPID pair — baked into the bundle at build time.
          # Without it the daily-reminder section hides itself entirely.
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      # Copy index.html as 404.html for SPA client-side routing
      - run: cp dist/index.html dist/404.html

      # voca stays private; GitHub Pages can't build from a private repo on a
      # free plan. So instead of publishing this repo's own Pages site
      # (actions/upload-pages-artifact + deploy-pages), the built static
      # output is pushed to voca-pages — a separate, public repo dedicated
      # purely to hosting it. Nothing but compiled assets ever lives there.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: tomzaku/voca-pages
          publish_branch: main
          publish_dir: ./dist
